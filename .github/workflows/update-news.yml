name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect headlines
        run: python scripts/fetch_news.py

      - name: Save and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- news.json; then
            echo "No new headlines."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update headlines"
          git push
          # pushes made by this token don't start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
